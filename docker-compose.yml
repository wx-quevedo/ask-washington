# Local development database: Postgres 16 with the pgvector extension.
# Works with both `docker compose` and `podman compose`.
# Values come from .env (copy .env.example to .env first).
services:
  db:
    image: docker.io/pgvector/pgvector:pg16
    container_name: ask-washington-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-askw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askw_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ask_washington}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ask_washington_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ask_washington_pgdata:
