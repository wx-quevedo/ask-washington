# nginx site for Ask Washington. Installed by deploy/remote-deploy.sh into
# /etc/nginx/sites-available/ask.inmersoft.com; certbot --nginx adds the HTTPS server
# block and the HTTP -> HTTPS redirect afterwards. The upstream port is replaced at deploy time.
server {
    listen 80;
    listen [::]:80;
    server_name ask.inmersoft.com;

    # Questions are at most 500 characters.
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        proxy_pass http://127.0.0.1:8710;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) so a client cannot inject addresses into the header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }
}
