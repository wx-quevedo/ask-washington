    title: "Tourism marketing through virtual environment experience"
    year: 2017
    citations: 9
    venue: "Proceedings of the 9th International Conference on Education Technology and Computers (ICETC '17, ACM)"
    doi: "10.1145/3175536.3176651"
    url: "https://doi.org/10.1145/3175536.3176651"
    abstract: ""
    abstract_source: ""
