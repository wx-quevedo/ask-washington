  - id: p23
    title: "Performance evaluation of WebGL and WebVR apps in VR environments"
    year: 2019
    citations: 7
    venue: "Advances in Visual Computing - International Symposium on Visual Computing (ISVC, Springer LNCS)"
    doi: "10.1007/978-3-030-33723-0_46"
    url: "https://doi.org/10.1007/978-3-030-33723-0_46"
    abstract: "This paper presents an evaluation of devices and browsers performance when executing web applications in WebGL and WebVR. For this purpose, the measurement of several computational resources is performed to determine which technology optimizes hardware resources when working with this type of technologies. For the purpose of this study, an application has been developed in Unity 3D that provides the exact values that the computational resources consume. In this context objects and particle systems are used to give a stress behavior on hardware entities. As a result, it was determined that WebGL and WebVR have similar performances in executions on a PC while for WebVR mobile devices it has a remarkable performance compared to WebGL."
    abstract_source: "https://link.springer.com/chapter/10.1007/978-3-030-33723-0_46"
    notes: ""
  - id: p24
    title: "Real-time virtual reality visualizer for unmanned aerial vehicles"
    year: 2018
    citations: 7
    venue: "International Conference on Augmented Reality, Virtual Reality and Computer Graphics (AVR, Springer LNCS)"
    doi: "10.1007/978-3-319-95282-6_35"
    url: "https://doi.org/10.1007/978-3-319-95282-6_35"
    abstract: "The visualization of tele-operated and autonomous executions in the field becomes difficult if the real environments are located in remote areas or present potential dangers for visualizing clients. This work proposes an application based on virtual reality to recreate in real time the execution tasks of a UAV, which is operated remotely or autonomously on a real environment. To achieve a third level of immersion, the reconstruction of the real environment where the field tests are executed is considered, offering the possibility of knowing the real scenario where the tests are executed. The consideration of using commercial UAV development kits is taken into account to obtain internal information, as well as to control the drone from client devices. The results presented validate the unification of 3D models and the reconstruction of the environment, as well as the consumption of vehicle information and climate parameters."
    abstract_source: "https://link.springer.com/chapter/10.1007/978-3-319-95282-6_35"
    notes: ""
  - id: p25
    title: "System of evaluation for reading based on eye tracking"
    year: 2017
    citations: 6
    venue: "Emerging Technologies for Education - International Symposium on Emerging Technologies for Education (Springer LNCS)"
    doi: "10.1007/978-3-319-71084-6_26"
    url: "https://doi.org/10.1007/978-3-319-71084-6_26"
    abstract: "The present work aims to develop a non-invasive interactive system by using an eye sensor known as Tobii Eye Tracking to evaluate students in environments such as reading or visual appreciation. Finally, the results obtained are shown graphically showing the trajectories of what the person observes and a statistical weighting close to the normal standard."
    abstract_source: "https://link.springer.com/chapter/10.1007/978-3-319-71084-6_26"
    notes: ""
