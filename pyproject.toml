[project]
name = "ask-washington"
version = "0.1.0"
description = "RAG chat that answers recruiter questions about Washington X. Quevedo, citing his sources."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Washington X. Quevedo" }]
dependencies = [
    "fastapi>=0.143.3",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-readers-file>=0.7.0",
    "llama-index-vector-stores-postgres>=0.9.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
