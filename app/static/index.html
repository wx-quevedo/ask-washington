<!doctype html>
<html lang="{{html_lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title data-i18n="page_title">{{page_title}}</title>
  <meta name="description" content="{{meta_description}}" data-i18n-attr="content:meta_description">
  <meta name="ask-washington-embed-origins" content="{{embed_origins}}">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body class="{{embed_class}}">
  <a class="skip-link" href="#question" data-i18n="skip_link">{{skip_link}}</a>

  <div class="chat">
    <header class="chat-header">
      <div class="chat-header-inner">
        <div class="brand">
          <h1 data-i18n="title">{{title}}</h1>
          <p class="subtitle" data-i18n="subtitle">{{subtitle}}</p>
        </div>
        <nav class="profiles" aria-label="{{footer_nav_label}}" data-i18n-attr="aria-label:footer_nav_label">
          <a href="https://www.linkedin.com/in/wxquevedo" rel="noopener" target="_blank" data-i18n="footer_linkedin">{{footer_linkedin}}</a>
          <a href="https://github.com/wx-quevedo" rel="noopener" target="_blank" data-i18n="footer_github">{{footer_github}}</a>
          <a href="https://scholar.google.com/citations?user=zPNPhwkAAAAJ" rel="noopener" target="_blank" data-i18n="footer_scholar">{{footer_scholar}}</a>
        </nav>
      </div>
    </header>

    <main id="thread" class="thread" role="log" aria-live="polite" aria-relevant="additions"
      aria-label="{{thread_label}}" data-i18n-attr="aria-label:thread_label" tabindex="0">
      <div id="messages" class="thread-inner">
        <div class="msg assistant">
          <p class="sr-only" data-i18n="assistant_label">{{assistant_label}}</p>
          <div class="bubble"><p data-i18n="greeting">{{greeting}}</p></div>
        </div>
        <div id="chips" class="chips" role="group" aria-label="{{suggested_label}}" data-i18n-attr="aria-label:suggested_label">
          <button type="button" class="chip" data-i18n="suggestion_1">{{suggestion_1}}</button>
          <button type="button" class="chip" data-i18n="suggestion_2">{{suggestion_2}}</button>
          <button type="button" class="chip" data-i18n="suggestion_3">{{suggestion_3}}</button>
          <button type="button" class="chip" data-i18n="suggestion_4">{{suggestion_4}}</button>
        </div>
      </div>
    </main>

    <footer class="composer">
      <div class="composer-inner">
        <form id="ask-form" class="composer-form" novalidate>
          <label for="question" class="sr-only" data-i18n="question_label">{{question_label}}</label>
          <div class="composer-box">
            <textarea id="question" name="question" rows="1" maxlength="500" required
              aria-describedby="question-count"
              placeholder="{{placeholder}}" data-i18n-attr="placeholder:placeholder"></textarea>
            <button type="submit" id="send" class="send" aria-label="{{send_label}}" data-i18n-attr="aria-label:send_label">
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
                <path d="M3.4 20.4 21 12 3.4 3.6 3.4 10.1 15 12 3.4 13.9z" fill="currentColor"></path>
              </svg>
            </button>
          </div>
          <p id="question-count" class="count" aria-live="polite" hidden></p>
        </form>
        <p class="disclaimer" data-i18n="disclaimer">{{disclaimer}}</p>
      </div>
    </footer>
  </div>
</body>
</html>
